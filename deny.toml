[advisories]
yanked = "deny"

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The rustls trust anchors are Mozilla's CA bundle, published as *data* under
# the Community Data License Agreement rather than as code under a software
# licence. CDLA-Permissive-2.0 imposes no conditions on use or redistribution,
# so it is allowed for that one crate rather than for the whole graph.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency inside this workspace carries no version requirement, which
# is what `wildcards` refuses everywhere else. The exemption is limited to
# unpublished path dependencies, so the ban still covers every crate that comes
# from a registry.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
