[advisories]
yanked = "deny"

[licenses]
# Keymaster is an unpublished application; it carries no license expression yet.
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# The rustls trust anchors are Mozilla's CA bundle, published as *data* under
# the Community Data License Agreement rather than as code under a software
# licence. CDLA-Permissive-2.0 imposes no conditions on use or redistribution,
# so it is allowed for that one crate rather than for the whole graph.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
