[workspace]
members = ["crates/cli", "crates/core"]
# `cargo run -- …`, `cargo build`, and `cargo test` at the workspace root are
# the CLI's, so every invocation in the documentation keeps working unchanged.
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
# Must equal `toolchain.channel` in rust-toolchain.toml.
# crates/cli/tests/toolchain_pin.rs fails if the two ever disagree.
rust-version = "1.92.0"
license = "Unlicense"
# Keymaster is an application, not a crates.io library; the Unlicense
# covers use, and publishing to crates.io stays a separate decision.
publish = false

# Both crates inherit these with `[lints] workspace = true`, so a lint is
# configured once for the whole repository. `clippy.toml` and `deny.toml` stay
# at the root and apply to every member for the same reason.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
# The list lives in clippy.toml; it keeps unbounded HTTP clients out of the
# codebase so every request goes through the one approved constructor.
disallowed_methods = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
# Thresholds live in clippy.toml.
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
