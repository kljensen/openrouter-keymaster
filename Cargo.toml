[package]
name = "keymaster"
version = "0.1.0"
edition = "2024"
# Must equal `toolchain.channel` in rust-toolchain.toml.
# tests/toolchain_pin.rs fails if the two ever disagree.
rust-version = "1.92.0"
# Keymaster is an application, not a crates.io library.
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Receiver fingerprints are a digest, so a changed delivery destination is
# detectable without a collision-prone ad-hoc hash.
sha2 = "0.10"
thiserror = "2.0"
# `serde-well-known` brings the RFC 3339 parser and serializer used for every
# timestamp in the configuration and in state.
time = { version = "0.3", features = ["serde-well-known"] }
toml = "1.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
# The test harness drives the blocking client the production code will use,
# over plain HTTP to a local server, so it needs no TLS backend of its own.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
tempfile = "3.23"
# `wiremock` is async; the harness owns the runtime so tests stay synchronous.
tokio = { version = "1", features = ["rt-multi-thread"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
# Thresholds live in clippy.toml.
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
