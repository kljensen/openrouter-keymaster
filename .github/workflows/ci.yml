name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run for the same branch or pull request cancels the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # With no argument, rustup installs the toolchain and components that
      # rust-toolchain.toml pins.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.2

      - uses: taiki-e/install-action@v2.86.6
        with:
          tool: cargo-deny@0.20.2

      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo deny check advisories licenses bans sources
