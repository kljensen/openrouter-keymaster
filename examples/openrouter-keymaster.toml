# An example Keymaster desired-state configuration.
#
# Every value here is fake. Copy this file to `openrouter-keymaster.toml`,
# replace the names, paths, and identifiers, and run `openrouter-keymaster plan`.
#
# Keymaster never reads an OpenRouter credential from this file. The management
# key comes from the `OPENROUTER_MANAGEMENT_KEY` environment variable, and a new
# inference key's plaintext is delivered to a receiver — never written here,
# never printed. A field whose value looks like an OpenRouter credential is
# rejected, and so is any field this schema does not define.
#
# One thing here can be a secret: a log destination's `config` holds the
# third-party credential OpenRouter needs to reach the sink. A file with a
# `[log_destinations.*]` block belongs out of version control, or encrypted the
# way any other secret is. See the block at the bottom.

version = 1

[defaults]
# Whether spend on your own provider keys counts against a USD limit.
# Individual guardrails and keys may override this.
include_byok_in_limit = false

# A workspace carries a pooled spending cap and a default guardrail. Identity is
# the workspace UUID: removing this block orphans the binding, and
# `openrouter-keymaster delete workspace --id UUID` is the only deletion.
[workspaces.golf_club]
name = "Golf Club"
slug = "golf-club"
description = "The golf club's inference workspace."
# Any of daily, weekly, monthly, lifetime, in USD. OpenRouter checks
# lifetime > monthly > weekly > daily on every budget write, and so does
# Keymaster, before anything is sent. Omitting the table leaves OpenRouter's
# budgets alone; writing one makes it the complete desired set.
budgets = { monthly = 50, lifetime = 500 }
# Only a budget PUT can write this, so it needs at least one budget.
include_byok_in_budgets = false
# Every workspace has a default guardrail, under an identity derived from the
# workspace's own, which governs all traffic in it. Naming a block here binds it
# to that identity; the guardrail is never created by POST and never imported by
# name.
default_guardrail = "cheap_summarization"

# A guardrail holds the model, provider, and budget policy. A key is assigned
# at most one guardrail.
[guardrails.cheap_summarization]
# No `name`: this block is `golf_club`'s default guardrail, and OpenRouter names
# that one itself — `Workspace <uuid> Default` — and refuses to change it.
# `openrouter-keymaster status` shows the name it gave.
description = "Small, cheap models for background summarization."
allowed_models = ["google/gemini-2.5-flash", "openai/gpt-4o-mini"]
denied_providers = ["example-untrusted-provider"]
# A guardrail budget must name its reset interval: OpenRouter refuses a
# guardrail limit that has none. A key budget may stand alone, and then never
# refills.
limit_usd = 10
reset_interval = "monthly"
require_zdr = true
# This block is `golf_club`'s default guardrail, so its workspace is that one.
# A guardrail that is not a workspace default names its workspace here, by local
# address — or by raw `workspace_id`, for a workspace Keymaster does not manage.
workspace = "golf_club"

[keys.golf_jobfeed]
name = "golf-jobfeed"
limit_usd = 5
limit_reset = "monthly"
expires_at = "2027-01-01T00:00:00Z"
disabled = false
# The workspace this key is created in, by local address. A key resolves it
# through the workspace's binding at plan time, and is held back until there is
# one. The raw `workspace_id = "…"` form stays for a workspace Keymaster does
# not manage; a block may write one or the other, never both.
workspace = "golf_club"
# The organization member the key is created on behalf of. Only meaningful for
# organization-owned keys, and — like `expires_at` and `workspace_id` — fixed
# when the key is created: `POST /keys` accepts it and `PATCH /keys/{hash}` has
# no field for it, so changing it here plans a replacement rather than a patch.
# creator_user_id = "user_2dHFtVWx2n56w6HkM0000000000"
guardrail = "cheap_summarization"
receiver = "jobfeed_vault"
# Raise this to ask for a replacement key. It only ever moves upward.
generation = 1

# TOML has no null, so clearing a remote field is spelled by naming it here.
# Omitting a field means "leave the remote value alone"; naming it in `clear`
# means "set the remote value to nothing". Uncomment to drop the expiry:
# clear = ["expires_at"]

# A receiver is where a newly created key's plaintext goes. Nothing is
# implicit: a key with no receiver can be managed and imported, but never
# created.

# The file receiver writes one 0600 file. It is meant for local development
# and tests.
[receivers.laptop_file]
type = "file"
path = "/var/lib/keymaster/laptop-pi.key"

# The command receiver runs a program with no shell and hands it a JSON
# envelope on stdin. Arguments are a vector and never carry secret material.
[receivers.jobfeed_vault]
type = "command"
program = "/usr/local/bin/keymaster-vault-receiver"
args = ["add-file", "jobfeed_openrouter_api_key"]

# A log destination is where OpenRouter forwards this workspace's request logs.
# Identity is the destination UUID: removing this block orphans the binding, and
# `openrouter-keymaster delete log-destination --id UUID` is the only deletion.
#
# `type` and the workspace are fixed when the destination is created —
# OpenRouter's PATCH accepts neither — so changing either is held-back drift the
# plan names, and the way out is an explicit delete followed by an apply.
[log_destinations.club_audit]
type = "datadog"
name = "Golf Club audit log"
# By local address, resolved through the workspace's binding at plan time, and
# held back until there is one. `workspace_id = "…"` is the raw form, for a
# workspace Keymaster does not manage; never both.
workspace = "golf_club"
enabled = true
# When true, request and response bodies are withheld and only metadata is
# forwarded.
privacy_mode = false
# The fraction of requests forwarded, between 0.0001 and 1. Omitting it leaves
# whatever OpenRouter has.
sampling_rate = 1
# Provider-specific, validated server-side, and passed through as JSON. THIS IS
# WHERE THE SECRET GOES: whatever key or token the sink needs. It is write-only
# — OpenRouter masks it on read — so state records only a SHA-256 digest of it,
# and a plan says `config: changed` and never what changed.
config = { site = "datadoghq.com", apiKey = "REPLACE-ME" }
